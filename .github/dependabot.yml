version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 5 days before updating to help circumvent supply chain attacks
    cooldown:
      default-days: 5
      # Exclude plugin-e2e to prevent false positives with canary e2e tests
      exclude:
        - "@grafana/plugin-e2e"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # eslint 10 is blocked: eslint-plugin-react has no eslint-10-compatible
      # release (7.37.5 peers eslint "^9.7"). Remove once it supports eslint 10
      # — see PR #67.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript 7 is blocked: no @typescript-eslint release accepts TS >=6.1
      # (8.72.0 still peers typescript ">=4.8.4 <6.1.0", and there is no v9
      # line), so npm ci fails on ERESOLVE before anything compiles. Remove once
      # @typescript-eslint supports TS 7 — see PR #76.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # React is a shared external provided by Grafana at runtime, so keep the
      # types and test runtime on the same minor Grafana ships (13.x: 19.2).
      # Remove once Grafana itself moves to React 19.3+.
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # @types/node tracks the Node major in .nvmrc (24), not the latest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      unit-test:
        patterns:
          - "@testing-library/*"
          - "jest*"
          - "@types/jest"
      eslint:
        patterns:
          - "@grafana/eslint-config"
          - "eslint*"
          - "@typescript-eslint/*"
          - "@stylistic/*"
      grafana:
        patterns:
          - "@grafana/*"
        dependency-type: "production"
        # Include majors so @grafana/* packages are always bumped together
        # (a lone @grafana/data major PR mixes v12/v13 types — see #49)
        update-types:
          - "major"
          - "minor"
          - "patch"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Default scope (direct deps): grafana-plugin-sdk-go, grpc, protobuf, uuid.
    commit-message:
      prefix: "chore"
      include: "scope"

