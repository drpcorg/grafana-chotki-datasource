message CreateOwnerRequest {
  bytes ownerId = 1;
  // billingVersion the owner is created with. Absent/0 keeps the legacy
  // defaults (welcome FreeBalance grant); >= 1 opts the new owner into the
  // tier system and suppresses the welcome grant. The caller (keymanager)
  // owns this policy; chotki only records the decision.
  int64 billingVersion = 2;
}
