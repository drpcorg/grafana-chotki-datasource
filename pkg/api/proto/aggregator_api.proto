}

message Key {
  bytes KeyId = 1;
  bytes OwnerId = 2;
  string Name = 3;
  bool Status = 4;
  google.protobuf.Timestamp UpdatedAt = 5;

  string ApiKey = 6;
  int64 RateLimit = 7;
  repeated string IpWhitelist = 8;
  repeated string Providers = 9;
  repeated string CorsOrigins = 10;
  bool JwtEnabled = 11;
  repeated PublicKey JwtPublicKeys = 12;
  bool FallbackEnabled = 13;
  repeated string FallbackProviders = 14;
  bool MevEnabled = 15;
  repeated string MevProviders = 16;
  bool MevFallback = 17;

  int64 ComputeUnitDayLimit = 18;
  repeated string MethodBlacklist = 19;
  repeated string ContractWhiteList = 20;
  bool Archived = 21;
  string Description = 22;
  repeated int32 Tags = 23;
  repeated string MethodWhitelist = 24;
  repeated int32 ChainsWhitelist = 25;
  bool EnableTraceID = 26;
  repeated int32 BalanceNotificationOptions = 27;
  string ClientSpec = 28; // JSON array of client routing rules, see protocol.Client format
  int32 MevMode = 29; // 0=unset, 1=enabled, 2=disabled; takes precedence over MevEnabled
}

// ChotkiDB public API
message GetOwnerRequest {bytes ownerId = 1;}
message GetOwnerResponse {Owner owner = 1;}
message GetAllOwnerIdsRequest {}
message GetAllOwnerIdsResponse { repeated bytes ownerIds = 1; }
message GetOwnerHitsRequest {bytes ownerId = 1;}
message GetOwnerHitsResponse {int64 hits = 1;}
message GetFullOwnerRequest {
  bytes ownerId = 1;
  bool loadBalance = 2;
}
message GetFullOwnerResponse { OwnerFull owner = 1; }

// AuthSnapshot is the consistent point-in-time view consumed by post-paid
// CheckBalance. owner / key fields are nil when the corresponding object is
// not found (so the client can treat that as a clean "not found" without
// relying on gRPC error sentinels). The three counters are read inside the
// same StartRead transaction as the static fields.
message AuthSnapshot {
  Owner owner = 1;
  Key   key   = 2;
  int64 ownerTotalCU     = 3;
  int64 ownerFreeBalance = 4;
  int64 keyDailyUsedCU   = 5;
  repeated PackagePoolSnapshot packagePools = 6;
}

// PackagePoolSnapshot is a point-in-time view of a prepaid package pool.
// Remaining = credited - spent (floored at 0 by consumers).
message PackagePoolSnapshot {
  string tag       = 1;
  int64  credited  = 2;
  int64  spent     = 3;
  string periodEnd = 4; // RFC3339
  // Debug-only refs to the addon schema and tier that opened the pool.
  int64  addonId        = 5;
  int64  subscriptionId = 6;
}

message CreatePackagePoolRequest {
  bytes  owner_id    = 1;
  string tag         = 2;
  int64  credited_cu = 3;
  string period_end  = 4; // RFC3339
  bool   carry_over  = 5;
  // Debug-only refs to the addon schema and tier opening/renewing the pool.
  int64  addon_id        = 6;
  int64  subscription_id = 7;
}
message CreatePackagePoolResponse {}

message SpendPackagePoolRequest {
  bytes  owner_id = 1;
  string tag      = 2;
  int64  amount   = 3;
  // Optional: when set, Key.DailyUsedCU is incremented by `amount` so that
  // pool-covered traffic still counts against the per-key day limit.
  bytes  key_id   = 4;
}
message SpendPackagePoolResponse {
  int64 credited = 1;
  int64 spent    = 2;
  // Post-spend Key.DailyUsedCU (0 when key_id was not set or the key
  // increment failed best-effort).
  int64 keyDailyUsedCU = 3;
}

message BurnPackagePoolRequest {
  bytes  owner_id = 1;
  string tag      = 2;
}
message BurnPackagePoolResponse {
  int64 burned_cu = 1;
}

message RemovePackagePoolRequest {
  bytes  owner_id = 1;
  string tag      = 2;
}
message RemovePackagePoolResponse {}

message GetPackagePoolsRequest {
  bytes owner_id = 1;
}
message GetPackagePoolsResponse {
  repeated PackagePoolSnapshot pools = 1;
}
message GetAuthSnapshotRequest  { bytes ownerId = 1; bytes keyId = 2; }
message GetAuthSnapshotResponse { AuthSnapshot snapshot = 1; }

// AuthRef is one owner+key pair to resolve in a GetAuthSnapshots batch.
message AuthRef { bytes ownerId = 1; bytes keyId = 2; }
message GetAuthSnapshotsRequest { repeated AuthRef refs = 1; }

// AuthSnapshotResult is the per-ref outcome; snapshot is unset and error is set
// (e.g. "not found") when that ref fails, so one bad ref never fails the batch.
message AuthSnapshotResult {
  AuthSnapshot snapshot = 1;
  string error = 2;
}
message GetAuthSnapshotsResponse { repeated AuthSnapshotResult results = 1; }
