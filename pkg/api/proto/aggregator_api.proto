  SPENDING_RESULT_SUCCESS = 0;
  SPENDING_RESULT_NOT_ENOUGH_BALANCE = 1;
  SPENDING_RESULT_KEY_LIMIT_EXCEEDED = 2;
  SPENDING_RESULT_ERROR = 3;
}

