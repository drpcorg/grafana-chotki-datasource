  int32 provider_index = 7;
  emerald.ChainRef chain = 3;
  NodeDescription description = 4;
  NodeStatus status = 5;
  bool new_chain_head = 6;
}

message Timings {
  TimingType name = 1;
  uint64 time = 2;
}

enum TimingType {
  TIMING_TYPE_UNDEFINED = 0;
  TIMING_TYPE_CREATED = 1;
  TIMING_TYPE_RECIVED_FROM_NODE = 2;
  TIMING_TYPE_SENT_TO_AGGREGATOR = 3;
  TIMING_TYPE_RECIVED_FROM_PROVIDER = 4;
  TIMING_TYPE_SENT_TO_PROXY = 5;
  TIMING_TYPE_RECIVED_FROM_AGGREGATOR = 6;
  TIMING_TYPE_APPLIED_ON_PROXY = 7;
}

message NodeDescription {
  repeated Capabilities capabilities = 1;
  repeated string supported_methods = 2;
  repeated string supported_subscriptions = 3;
  BuildInfo node_build_info = 4;
  repeated LowerBoundCoeff lower_bounds = 5;
  repeated emerald.FinalizationData finalizations = 6;
}

message NodeStatus {
  uint64 current_height = 1;
  emerald.AvailabilityEnum availability = 2;
  uint64 slot = 3;
  uint64 current_lower_height = 4 [deprecated = true];
  uint64 current_lower_slot = 5 [deprecated = true];
  uint64 current_lower_data_timestamp = 6 [deprecated = true];
  double state_remove_speed = 7 [deprecated = true];
  double slot_remove_speed = 8 [deprecated = true];
  repeated LowerBoundCoeff lower_bounds = 9 [deprecated = true];
  repeated emerald.FinalizationData finalizations = 10 [deprecated = true];
  repeated Timings timings = 11;
}

enum LowerBoundType {
  LOWER_BOUND_UNSPECIFIED = 0;
  LOWER_BOUND_SLOT = 1;
  LOWER_BOUND_STATE = 2;
  LOWER_BOUND_BLOCK = 3;
  LOWER_BOUND_TX = 4;
  LOWER_BOUND_LOGS = 5;
  LOWER_BOUND_TRACE = 6;
  LOWER_BOUND_PROOF = 7;
  LOWER_BOUND_BLOB = 8;
  LOWER_BOUND_EPOCH = 9;
  LOWER_BOUND_RECEIPTS = 10;
}

message LowerBoundCoeff {
  double k = 1;
  double b = 2;
  LowerBoundType key = 3;
}

message BuildInfo {string version = 1;}

message Capabilities {
  bool has_archive = 1;
  bool has_long_range = 2;
  bool has_extra_gas = 3;
  bool has_pre_nitro_redirect = 4;
  bool has_pre_bedrock_redirect = 5;
  string client = 6;
  string clientVersion = 7;
  bool has_flashblocks = 8;
  bool has_include_hl_native_tx = 9;
  bool has_exclude_hl_native_tx = 10;
  bool has_secure_signed_support = 11;
  bool has_hl_all_info = 12;
  bool has_hl_partial_info = 13;
}

enum Region {
  UNKNOWN_REGION = 0;
  EUROPE_WEST = 1;
  US_CENTRAL = 2;
  ASIA_SOUTH_EAST = 3;
  US_EAST = 4;
  SA_EAST = 5;
  ASIA_NORTH_EAST = 7;
  US_WEST = 8;
  EUROPE_NORTH_WEST = 9;
}

message Owner {
  bytes OwnerID = 1;
  int64 ComputeUnitBalance = 2;
  int64 Tier = 3;
  bool Special = 4;
  int32 DiscountPercent = 5;
  int64 OverdraftLimit = 6;
  int64 FreeComputeUnitBalance = 7;
  google.protobuf.Timestamp CreatedAt = 8;
  string NodeCoreApiToken = 9;
  map<string, string> Addons = 10;
  map<string, int32> Discounts = 11;
  // BillingVersion: 0 = legacy (grandfathered), >= 1 = new tier system.
  // PlanClass/PlanTag/PlanLimits are NOT transported: they are derived from
  // this field plus Addons metadata on each side (data.Owner.DerivePlan).
  int64 BillingVersion = 12;
}

message OwnerFull {
  bytes OwnerId = 1;
  int64 Balance = 2;
  int64 BalanceLowWarn = 3;
  int64 BalanceLowCrit = 4;
  int32 DiscountPercent = 5;
  int64 OverdraftLimit = 6;
  int32 Tier = 7;
  int64 TotalSpent = 8;
  int64 FreeComputeUnitBalance = 9;
  map<string, string> Addons = 10;
  google.protobuf.Timestamp CreatedAt = 11;
  string NodeCoreApiToken = 12;
  map<string, int32> Discounts = 13;
}

message OwnerMetadata {
