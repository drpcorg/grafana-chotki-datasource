    PatchName patchName = 1;
    PatchDescription patchDescription = 2;
    PatchStatus patchStatus = 3;
    PatchIpWhitelist patchIpWhitelist = 4;
    PatchContractWhitelist patchContractWhitelist = 5;
    PatchTags patchTags = 6;
    PatchMethodWhitelist patchMethodWhitelist = 7;
    PatchMethodBlacklist patchMethodBlacklist = 8;
