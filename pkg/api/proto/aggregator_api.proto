syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "common.proto";

package aggregator_api;

service AggregatorService {
  // node statuses
  rpc BlockHeight(BlockHeighRequest) returns (BlockHeightResponse) {}
  rpc TxHeight(TxHeightRequest) returns (TxHeightResponse) {}
  rpc Finalization(FinalizationRequest) returns (emerald.FinalizationData) {}
  rpc SubscribeNodeStatus(SubscribeNodeStatusRequest)
      returns (stream SubscribeNodeStatusResponse) {}

  // blocks stream
  rpc StreamChainHeads(StreamChainHeadsRequest)
      returns (stream ChainHeadEvent) {}

  // Owners
  rpc CreateOwner(CreateOwnerRequest) returns (CreateOwnerResponse) {}
  rpc GetOwner(GetOwnerRequest) returns (GetOwnerResponse) {}
  rpc GetFullOwner(GetFullOwnerRequest) returns (GetFullOwnerResponse) {}
  // GetAuthSnapshot returns owner+key static fields and the three CRDT
  // counters (TotalCU, FreeBalance, DailyUsedCU) in a single chotki StartRead
  // transaction. Used by post-paid auth-cache miss to seed the in-process
  // cache with one round-trip; CheckBalance then reads from the cache only.
  rpc GetAuthSnapshot(GetAuthSnapshotRequest) returns (GetAuthSnapshotResponse) {}
  // GetAuthSnapshots resolves many owner+key pairs under one chotki StartRead
  // (one snapshot for the whole batch). Per-ref errors ride in the response.
  rpc GetAuthSnapshots(GetAuthSnapshotsRequest) returns (GetAuthSnapshotsResponse) {}
  rpc GetOwnersWithBalance(GetOwnersWithBalanceRequest) returns (GetOwnersWithBalanceResponse) {}
  rpc GetOwnerHits(GetOwnerHitsRequest) returns (GetOwnerHitsResponse) {}
  rpc GetOwnerMetadata(GetOwnerMetadataRequest)
      returns (GetOwnerMetadataResponse) {}
  rpc SetBalanceNotificationThresholds(SetBalanceNotificationThresholdsRequest)
      returns (SetBalanceNotificationThresholdsResponse) {}
  rpc SetMev(SetMevRequest) returns (SetMevResponse) {}
  rpc SetDayLimit(SetDayLimitRequest) returns (SetDayLimitResponse) {}
  rpc SetDiscount(SetDiscountRequest) returns (SetDiscountResponse) {}
  rpc SetOverdraft(SetOverdraftRequest) returns (SetOverdraftResponse) {}
  rpc SetOwnerBillingVersion(SetOwnerBillingVersionRequest) returns (SetOwnerBillingVersionResponse) {}
  rpc IncrementOwnerBalance(IncrementOwnerBalanceRequest) returns (IncrementOwnerBalanceResponse) {}
  rpc SetOwnerBalance(SetOwnerBalanceRequest) returns (SetOwnerBalanceResponse) {}
  rpc ResetOwnerFreeBalance(ResetOwnerFreeBalanceRequest) returns (ResetOwnerFreeBalanceResponse) {}
  rpc IncrementOwnerFreeBalance(IncrementOwnerFreeBalanceRequest) returns (IncrementOwnerFreeBalanceResponse) {}
  rpc SpendOwnerFreeBalance(SpendOwnerFreeBalanceRequest) returns (SpendOwnerFreeBalanceResponse) {}
  rpc SpendOwnerBalance(SpendOwnerBalanceRequest) returns (SpendOwnerBalanceResponse) {}
  // BillOwnerBalance unconditionally charges the owner+key for `amount` CU.
  // Unlike SpendOwnerBalance it does NOT check balance, overdraft or day
  // limit — the caller is expected to have already gated the request via
  // CheckBalance. Used by V3 post-request billing where the request is
  // already served and must always be billed.
  rpc BillOwnerBalance(BillOwnerBalanceRequest) returns (BillOwnerBalanceResponse) {}
  // BillOwnerFreeBalance unconditionally decrements the owner free balance
  // by `amount`. Going negative is allowed.
  rpc BillOwnerFreeBalance(BillOwnerFreeBalanceRequest) returns (BillOwnerFreeBalanceResponse) {}
  rpc SetOwnerTotalCU(SetOwnerTotalCURequest) returns (SetOwnerTotalCUResponse) {}
  rpc IncrementOwnerTotalCU(IncrementOwnerTotalCURequest) returns (IncrementOwnerTotalCUResponse) {}
  rpc SystemSetOwnerUid(SystemSetOwnerUidRequest) returns (SystemSetOwnerUidResponse) {}
  rpc SetNodeCoreApiToken(SetNodeCoreApiTokenRequest) returns (SetNodeCoreApiTokenResponse) {}
  rpc SetOwnerAddon(SetOwnerAddonRequest) returns (SetOwnerAddonResponse) {}
  rpc RemoveOwnerAddon(RemoveOwnerAddonRequest) returns (RemoveOwnerAddonResponse) {}

  // Package billing pools (prepaid period-scoped CU pools).
  // CreatePackagePool opens a pool for (owner, tag). With carryOver=true and
  // an existing pool, the volume is credited into the same pool and the
  // period is extended; otherwise a fresh pool replaces the mapping.
  rpc CreatePackagePool(CreatePackagePoolRequest) returns (CreatePackagePoolResponse) {}
  // SpendPackagePool unconditionally increments the pool Spent counter by the
  // exact amount (post-response billing rail, mirrors BillOwnerBalance
  // semantics). Spent may exceed Credited: charges settle all-or-nothing, so
  // the crossing charge lands on the pool in full (light overdraft) and the
  // rollover job deducts it from the next period's pool.
  rpc SpendPackagePool(SpendPackagePoolRequest) returns (SpendPackagePoolResponse) {}
  // BurnPackagePool zeroes the pool remainder at period end. Idempotent.
  rpc BurnPackagePool(BurnPackagePoolRequest) returns (BurnPackagePoolResponse) {}
  // RemovePackagePool unmaps the pool from the owner (package disabled).
  rpc RemovePackagePool(RemovePackagePoolRequest) returns (RemovePackagePoolResponse) {}
  rpc GetPackagePools(GetPackagePoolsRequest) returns (GetPackagePoolsResponse) {}

  // Keys
  rpc GetKey(GetKeyRequest) returns (GetKeyResponse) {}
  rpc DeleteKey(DeleteKeyRequest) returns (DeleteKeyResponse) {}
  rpc IncrementKey(IncrementKeyRequest) returns (IncrementKeyResponse) {}
  rpc GetKeyHits(GetKeyHitsRequest) returns (GetKeyHitsResponse) {}
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse) {}
  rpc CreateOrUpdateKey(CreateOrUpdateKeyRequest)
      returns (CreateOrUpdateKeyResponse) {}
  rpc CreateKey(CreateKeyRequest) returns (CreateKeyResponse) {}
  rpc SetName(SetNameRequest) returns (SetNameResponse) {}
  rpc SetDescription(SetDescriptionRequest) returns (SetDescriptionResponse) {}
  rpc SetActive(SetActiveRequest) returns (SetActiveResponse) {}
  rpc SetArchived(SetArchivedRequest) returns (SetArchivedResponse) {}
  rpc SetCorsOrigins(SetCorsOriginsRequest) returns (SetCorsOriginsResponse) {}
  rpc SetProviders(SetProvidersRequest) returns (SetProvidersResponse) {}
  rpc SetIpWhitelist(SetIpWhitelistRequest) returns (SetIpWhitelistResponse) {}
  rpc SetFallback(SetFallbackRequest) returns (SetFallbackResponse) {}
  rpc AddPubKey(AddPubKeyRequest) returns (AddPubKeyResponse) {}
  rpc DropPubKey(DropPubKeyRequest) returns (DropPubKeyResponse) {}
  rpc SetJwtEnabled(SetJwtEnabledRequest) returns (SetJwtEnabledResponse) {}
  rpc SetRateLimitPerMinute(SetRateLimitPerMinuteRequest) returns (SetRateLimitPerMinuteResponse) {}
  rpc SetMethodsBlacklist(SetMethodsBlacklistRequest) returns (SetMethodsBlacklistResponse) {}
  rpc SetMethodsWhitelist(SetMethodsWhitelistRequest) returns (SetMethodsWhitelistResponse) {}
  rpc SetChainsWhitelist(SetChainsWhitelistUpdateRequest) returns (SetChainsWhitelistResponse) {}
  rpc SetContractWhitelist(SetContractWhitelistRequest) returns (SetContractWhitelistResponse) {}
  rpc SetTags(SetTagsRequest) returns (SetTagsResponse) {}
  rpc ResetCounters(ResetCountersRequest) returns (ResetCountersResponse) {}
  rpc GetAllOwnerIds(GetAllOwnerIdsRequest) returns (GetAllOwnerIdsResponse) {}
  rpc SetEnableTraceID(SetEnableTraceIDRequest) returns (SetEnableTraceIDResponse) {}
  rpc SetClientSpec(SetClientSpecRequest) returns (SetClientSpecResponse) {}
  rpc SetBalanceNotificationOptions(SetBalanceNotificationOptionsRequest) returns (SetBalanceNotificationOptionsResponse) {}

  // NodeCore
  rpc CreateNodeCoreKey(CreateNodeCoreKeyRequest) returns (CreateNodeCoreKeyResponse) {}
  rpc GetNodeCoreKey(GetNodeCoreKeyRequest) returns (GetNodeCoreKeyResponse) {}
  rpc ListNodeCoreKeys(ListNodeCoreKeysRequest) returns (ListNodeCoreKeysResponse) {}
  rpc PatchNodeCoreKey(PatchNodeCoreKeyRequest) returns (PatchNodeCoreKeyResponse) {}
  rpc DeleteNodeCoreKey(DeleteNodeCoreKeyRequest) returns (DeleteNodeCoreKeyResponse) {}
}

